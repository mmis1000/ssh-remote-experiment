# Builds the VSCodium remote server (REH) with the patches in patches/vscode and publishes it as a
# GitHub release tagged reh-<commit of this repo>. The Pages workflow then serves it at
#   https://mmis1000.me/ssh-remote-experiment/reh/<commit>/vscodium-reh-linux-x64.tar.gz
#
# The server's product commit is the commit of this repo that built it, so Open Remote SSH finds it
# with remote.SSH.serverDownloadUrlTemplate set to
#   https://mmis1000.me/ssh-remote-experiment/reh/${commit}/vscodium-reh-${os}-${arch}.tar.gz
# The jobs follow VSCodium's own publish-stable-linux.yml (compile, then reh_linux).

name: Server

on:
  push:
    branches: [main]
    paths:
      - patches/vscode/**
      - upstream.env
      - .github/workflows/server.yml
  workflow_dispatch: {}

concurrency:
  group: server
  cancel-in-progress: false

env:
  APP_NAME: VSCodium
  ASSETS_REPOSITORY: VSCodium/vscodium
  BINARY_NAME: codium
  DISABLE_UPDATE: 'yes'
  GH_REPO_PATH: VSCodium/vscodium
  ORG_NAME: VSCodium
  OS_NAME: linux
  VSCODE_QUALITY: stable
  SHOULD_BUILD: 'yes'
  # The server's product commit
  BUILD_SOURCEVERSION: ${{ github.sha }}

jobs:
  compile:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      VSCODE_ARCH: x64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Clone VSCodium and add the patches
        run: |
          . ./upstream.env
          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> "${GITHUB_ENV}"
          git clone --depth 1 --branch "${VSCODIUM_TAG}" "${VSCODIUM_REPO}" vscodium
          mkdir -p vscodium/patches/user
          cp patches/vscode/*.patch vscodium/patches/user/

      - name: Setup GCC
        uses: egor-tensin/setup-gcc@a2861a8b8538f49cf2850980acccf6b05a1b2ae4 # v2.0
        with:
          version: 10
          platform: x64

      - uses: actions/setup-node@v4
        with:
          node-version-file: vscodium/.nvmrc

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install libkrb5-dev
        run: sudo apt-get update -y && sudo apt-get install -y libkrb5-dev

      - name: Clone VS Code
        working-directory: vscodium
        run: ./get_repo.sh

      - name: Compile
        working-directory: vscodium
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHOULD_BUILD_REH: 'no'
          SHOULD_BUILD_REH_WEB: 'no'
        run: ./build.sh

      - name: Compress vscode artifact
        working-directory: vscodium
        run: |
          find vscode -type f -not -path "*/node_modules/*" -not -path "vscode/.build/node/*" -not -path "vscode/.git/*" > vscode.txt
          echo "vscode/.build/extensions/node_modules" >> vscode.txt
          echo "vscode/.git" >> vscode.txt
          tar -czf vscode.tar.gz -T vscode.txt

      - uses: actions/upload-artifact@v4
        with:
          name: vscode
          path: vscodium/vscode.tar.gz
          retention-days: 3

  reh:
    needs: compile
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - vscode_arch: x64
            npm_arch: x64
    env:
      VSCODE_ARCH: ${{ matrix.vscode_arch }}
      SHOULD_BUILD_REH: 'yes'
      SHOULD_BUILD_REH_WEB: 'no'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Clone VSCodium
        run: |
          . ./upstream.env
          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> "${GITHUB_ENV}"
          git clone --depth 1 --branch "${VSCODIUM_TAG}" "${VSCODIUM_REPO}" vscodium

      - name: Setup GCC
        uses: egor-tensin/setup-gcc@a2861a8b8538f49cf2850980acccf6b05a1b2ae4 # v2.0
        with:
          version: 10
          platform: x64

      - uses: actions/setup-node@v4
        with:
          node-version-file: vscodium/.nvmrc

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install libkrb5-dev
        run: sudo apt-get update -y && sudo apt-get install -y libkrb5-dev

      - uses: actions/download-artifact@v4
        with:
          name: vscode
          path: vscodium

      - name: Build the server
        working-directory: vscodium
        env:
          GITHUB_TOKEN: ${{ github.token }}
          npm_config_arch: ${{ matrix.npm_arch }}
        run: ./build/linux/package_reh.sh

      - name: Name the archive after the platform only
        working-directory: vscodium/assets
        run: |
          mkdir -p ../out
          mv "vscodium-reh-linux-${VSCODE_ARCH}-${RELEASE_VERSION}.tar.gz" "../out/vscodium-reh-linux-${VSCODE_ARCH}.tar.gz"
          cd ../out && sha256sum "vscodium-reh-linux-${VSCODE_ARCH}.tar.gz" > "vscodium-reh-linux-${VSCODE_ARCH}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: reh-linux-${{ matrix.vscode_arch }}
          path: vscodium/out/*
          retention-days: 3

  release:
    needs: reh
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: reh-linux-*
          path: out
          merge-multiple: true

      # The Pages workflow runs after this one and publishes the release
      - name: Create the release
        run: |
          . ./upstream.env
          gh release create "reh-${GITHUB_SHA}" out/*             --target "${GITHUB_SHA}"             --title "Server ${GITHUB_SHA::7} (VSCodium ${VSCODIUM_TAG})"             --notes "Remote server built from ${GITHUB_SHA} on VSCodium ${VSCODIUM_TAG}. Served at https://mmis1000.me/ssh-remote-experiment/reh/${GITHUB_SHA}/"
